<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inventaire déménagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===================== Design tokens ===================== */
  :root{
    --kraft: #d9c19c;
    --kraft-dark: #b8935f;
    --kraft-shadow: #8a6a3f;
    --paper: #f2e6cf;
    --ink: #2c2013;
    --ink-soft: #5a4a34;

    --don: #4c7a5d;      /* A donner association - vert réemploi */
    --don-dark: #375c45;
    --dechet: #b1483a;   /* A emmener déchetterie - rouge */
    --dechet-dark: #8c3428;
    --amiens: #3a6a8a;   /* A reprendre Amiens - bleu */
    --amiens-dark: #295068;
    --marraine: #8a5a8a; /* Pour marraine Saint-Jean - violet */
    --marraine-dark: #6b426b;

    --ok: #3f7d4f;
    --err: #b1483a;

    --radius: 14px;
    --font-display: 'Permanent Marker', cursive;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: var(--font-body);
    color: var(--ink);
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 2px, transparent 2px, transparent 14px),
      linear-gradient(160deg, var(--kraft) 0%, var(--kraft-dark) 100%);
    min-height:100%;
    display:flex;
    flex-direction:column;
  }

  /* ===================== Top bar ===================== */
  header.appbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-top,0px));
    padding-top: max(14px, env(safe-area-inset-top,0px));
    background: var(--ink);
    color: var(--paper);
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  header.appbar h1{
    font-family: var(--font-display);
    font-weight:400;
    font-size: 1.15rem;
    letter-spacing: .5px;
    margin:0;
    flex:1;
    transform: rotate(-1deg);
  }
  .btn-icon{
    background: transparent; border: 2px solid var(--paper);
    color: var(--paper); border-radius: 10px;
    width:40px; height:40px; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .btn-icon:active{ transform: scale(.92); }
  .user-chip{
    font-size:.75rem; opacity:.85; padding: 4px 10px;
    border: 1px dashed var(--paper); border-radius: 999px;
    white-space:nowrap;
  }

  main{ flex:1; padding: 18px 16px 40px; max-width: 640px; width:100%; margin:0 auto; }

  /* ===================== Home: room tags ===================== */
  .home-intro{
    text-align:center; margin-bottom: 22px;
  }
  .home-intro .eyebrow{
    font-size:.78rem; text-transform:uppercase; letter-spacing:2px;
    color: var(--ink-soft); font-weight:600;
  }
  .home-intro h2{
    font-family: var(--font-display); font-weight:400;
    font-size: 1.6rem; margin: 4px 0 0; transform: rotate(-1deg);
  }

  .room-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .room-tag{
    position:relative;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 4px 4px var(--radius) var(--radius);
    padding: 22px 10px 14px;
    text-align:center;
    font-family: var(--font-body);
    font-weight:700;
    font-size: .98rem;
    cursor:pointer;
    box-shadow: 3px 4px 0 var(--kraft-shadow);
    transition: transform .1s ease;
  }
  .room-tag:nth-child(odd){ transform: rotate(-1.3deg); }
  .room-tag:nth-child(even){ transform: rotate(1.3deg); }
  .room-tag:active{ transform: scale(.95) rotate(0deg); }
  .room-tag .hole{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:14px; height:14px; border-radius:50%;
    background: var(--kraft-dark);
    border: 2px solid var(--ink);
  }
  .room-tag .emoji{ display:block; font-size:1.4rem; margin-bottom:4px; }

  /* ===================== Room page ===================== */
  .room-header{
    display:flex; align-items:center; gap: 10px; margin-bottom: 18px;
  }
  .back-btn{
    background: var(--ink); color: var(--paper);
    border:none; border-radius: 10px; padding: 8px 14px;
    font-family: var(--font-body); font-weight:600; font-size:.85rem;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .back-btn:active{ opacity:.8; }
  .room-title{
    font-family: var(--font-display); font-weight:400; font-size: 1.5rem;
    margin:0; transform: rotate(-1deg);
  }

  .card{
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 3px 4px 0 var(--kraft-shadow);
  }
  .card h3{
    margin: 0 0 10px;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    font-weight:700;
  }

  .action-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .action-btn{
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 12px 8px;
    font-family: var(--font-body);
    font-weight:700;
    font-size: .82rem;
    cursor:pointer;
    background: #fff;
    color: var(--ink);
    text-align:center;
    line-height:1.25;
    transition: transform .08s ease;
  }
  .action-btn:active{ transform: scale(.96); }
  .action-btn.selected{ color:#fff; box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }
  .action-btn[data-action="don"].selected{ background: var(--don); border-color: var(--don-dark); }
  .action-btn[data-action="dechet"].selected{ background: var(--dechet); border-color: var(--dechet-dark); }
  .action-btn[data-action="amiens"].selected{ background: var(--amiens); border-color: var(--amiens-dark); }
  .action-btn[data-action="marraine"].selected{ background: var(--marraine); border-color: var(--marraine-dark); }

  label.field-label{
    display:block; font-size:.78rem; font-weight:700;
    color: var(--ink-soft); text-transform:uppercase; letter-spacing:1px;
    margin-bottom:6px;
  }
  input[type="text"]{
    width:100%; padding: 12px 14px; font-size:1rem;
    border: 2px solid var(--ink); border-radius: 10px;
    font-family: var(--font-body); background:#fff; color: var(--ink);
  }
  input[type="text"]:focus{ outline: 3px solid #00000022; }

  .photo-row{ display:flex; gap:10px; margin-top:14px; }
  .photo-btn{
    flex:1; border:none; border-radius: 10px; padding: 14px 8px;
    font-family: var(--font-body); font-weight:700; font-size:.85rem;
    cursor:pointer; color:#fff; display:flex; flex-direction:column;
    align-items:center; gap:4px;
  }
  .photo-btn.camera{ background: var(--ink); }
  .photo-btn.gallery{ background: var(--ink-soft); }
  .photo-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .photo-btn .ico{ font-size:1.3rem; }

  .preview-wrap{
    margin-top: 14px; text-align:center;
  }
  .preview-wrap img{
    max-width:100%; max-height:220px; border-radius:10px;
    border: 2px solid var(--ink);
  }

  .status{
    margin-top:14px; padding: 12px 14px; border-radius: 10px;
    font-size:.9rem; font-weight:600; display:none;
  }
  .status.show{ display:block; }
  .status.loading{ background:#fff3d6; color:#7a5a00; display:block; }
  .status.ok{ background:#e3f2e6; color: var(--ok); display:block; }
  .status.err{ background:#fbe4e1; color: var(--err); display:block; }

  .next-actions{
    display:flex; gap:10px; margin-top: 16px;
  }
  .next-btn{
    flex:1; border: 2px solid var(--ink); border-radius: 10px;
    padding: 12px; font-weight:700; font-family: var(--font-body);
    background:#fff; cursor:pointer; font-size:.85rem;
  }
  .next-btn.primary{ background: var(--ink); color:#fff; }

  .hint{ font-size:.78rem; color: var(--ink-soft); margin-top:8px; }

  /* first-run username modal */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding: 20px;
  }
  .modal-card{
    background: var(--paper); border: 2px solid var(--ink);
    border-radius: var(--radius); padding: 24px; max-width: 380px; width:100%;
    box-shadow: 4px 5px 0 var(--kraft-shadow);
  }
  .modal-card h2{
    font-family: var(--font-display); font-weight:400; margin:0 0 6px;
    font-size:1.3rem; transform: rotate(-1deg);
  }
  .modal-card p{ font-size:.88rem; color: var(--ink-soft); margin-top:0; }
  .modal-card button{
    margin-top: 14px; width:100%; background: var(--ink); color:#fff;
    border:none; border-radius:10px; padding: 13px; font-weight:700;
    font-family: var(--font-body); font-size:.95rem; cursor:pointer;
  }

  .view{ display:none; }
  .view.active{ display:block; }

  @media (min-width: 480px){
    .room-grid{ grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header class="appbar">
  <button class="btn-icon" id="homeBtnTop" title="Accueil" aria-label="Accueil">🏠</button>
  <h1 id="appTitle">Inventaire déménagement</h1>
  <span class="user-chip" id="userChip" title="Changer d'utilisateur">👤 —</span>
</header>

<main>
  <!-- HOME VIEW -->
  <section id="view-home" class="view active">
    <div class="home-intro">
      <div class="eyebrow">Étape 1</div>
      <h2>Dans quelle pièce es-tu ?</h2>
    </div>
    <div class="room-grid" id="roomGrid"></div>
  </section>

  <!-- ROOM VIEW (template, filled dynamically) -->
  <section id="view-room" class="view">
    <div class="room-header">
      <button class="back-btn" id="backBtn">← Accueil</button>
      <h2 class="room-title" id="roomTitle">Pièce</h2>
    </div>

    <div class="card">
      <h3>Que devient l'objet ?</h3>
      <div class="action-grid" id="actionGrid"></div>
    </div>

    <div class="card">
      <h3>Nom de l'objet</h3>
      <label class="field-label" for="objectName">Ex : commode chêne, carton livres...</label>
      <input type="text" id="objectName" placeholder="Nom du meuble ou de l'objet">

      <div class="photo-row">
        <button class="photo-btn camera" id="btnCamera" disabled>
          <span class="ico">📷</span> Prendre une photo
        </button>
        <button class="photo-btn gallery" id="btnGallery" disabled>
          <span class="ico">🖼️</span> Choisir un fichier
        </button>
      </div>
      <p class="hint" id="disabledHint">Choisis d'abord une action ci-dessus.</p>

      <input type="file" id="fileCamera" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="fileGallery" accept="image/*" style="display:none">

      <div class="preview-wrap" id="previewWrap" style="display:none;">
        <img id="previewImg" alt="Aperçu de la photo">
      </div>

      <div class="status" id="statusBox"></div>

      <div class="next-actions" id="nextActions" style="display:none;">
        <button class="next-btn primary" id="btnAnother">➕ Autre objet, même pièce</button>
        <button class="next-btn" id="btnHome2">🏠 Accueil</button>
      </div>
    </div>
  </section>
</main>

<!-- Username modal -->
<div class="modal-overlay" id="userModal" style="display:none;">
  <div class="modal-card">
    <h2>Bienvenue 👋</h2>
    <p>Indique ton prénom : il sera ajouté au nom de chaque photo pour savoir qui a fait l'inventaire.</p>
    <input type="text" id="userNameInput" placeholder="Ton prénom">
    <button id="userNameSave">Valider</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURATION — à faire une seule fois par le propriétaire
   du dépôt GitHub. Voir le README pour la procédure complète.
   ========================================================= */
const CONFIG = {
  // Colle ici l'URL de ton déploiement Google Apps Script (se termine par /exec)
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxe9gdp5vSDODMnxtqnMT_jVLI8OccOxhYHqQGt23aK1PGj9x95pLvlZc8w2n-ct_6M/exec"
};

/* =========================================================
   Données : pièces et actions
   ========================================================= */
const ROOMS = [
  { key: "chambre-1",  label: "Chambre 1",   emoji: "🛏️" },
  { key: "chambre-2",  label: "Chambre 2",   emoji: "🛏️" },
  { key: "bureau",     label: "Bureau",      emoji: "🗄️" },
  { key: "couloir",    label: "Couloir",     emoji: "🚪" },
  { key: "salon",      label: "Salon",       emoji: "🛋️" },
  { key: "cuisine",    label: "Cuisine",     emoji: "🍳" },
  { key: "toilettes",  label: "Toilettes",   emoji: "🚽" },
  { key: "garage",     label: "Garage",      emoji: "🚗" },
  { key: "salle-de-bain", label: "Salle de bain", emoji: "🛁" },
  { key: "buanderie",  label: "Buanderie",   emoji: "🧺" }
];

const ACTIONS = [
  { key: "don",      label: "À donner association" },
  { key: "dechet",   label: "À emmener déchetterie" },
  { key: "amiens",   label: "À reprendre Amiens" },
  { key: "marraine", label: "Pour marraine Saint-Jean" }
];

/* =========================================================
   État
   ========================================================= */
let currentRoom = null;
let currentAction = null;
let currentFile = null; // { base64, mimeType }

/* =========================================================
   Utilitaires
   ========================================================= */
function slugify(str){
  return (str || "objet")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .toLowerCase() || "objet";
}

function timestamp(){
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function getUserName(){ return localStorage.getItem("inv_username") || ""; }
function setUserName(name){ localStorage.setItem("inv_username", name); }

/* =========================================================
   Vue : navigation
   ========================================================= */
function showView(id){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goHome(){
  currentRoom = null; currentAction = null; currentFile = null;
  location.hash = "";
  document.getElementById("appTitle").textContent = "Inventaire déménagement";
  showView("view-home");
}

function openRoom(roomKey, pushHash = true){
  const room = ROOMS.find(r => r.key === roomKey);
  if(!room) return goHome();
  currentRoom = room;
  currentAction = null;
  resetObjectForm();
  document.getElementById("roomTitle").textContent = room.label;
  document.getElementById("appTitle").textContent = room.label;
  if(pushHash) location.hash = room.key;
  renderActionButtons();
  showView("view-room");
}

/* =========================================================
   Rendu accueil
   ========================================================= */
function renderRoomGrid(){
  const grid = document.getElementById("roomGrid");
  grid.innerHTML = "";
  ROOMS.forEach(room => {
    const tag = document.createElement("div");
    tag.className = "room-tag";
    tag.innerHTML = `<span class="hole"></span><span class="emoji">${room.emoji}</span>${room.label}`;
    tag.addEventListener("click", () => openRoom(room.key));
    grid.appendChild(tag);
  });
}

/* =========================================================
   Rendu boutons d'action dans une pièce
   ========================================================= */
function renderActionButtons(){
  const grid = document.getElementById("actionGrid");
  grid.innerHTML = "";
  ACTIONS.forEach(action => {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.dataset.action = action.key;
    btn.textContent = action.label;
    btn.addEventListener("click", () => selectAction(action.key));
    grid.appendChild(btn);
  });
}

function selectAction(actionKey){
  currentAction = actionKey;
  document.querySelectorAll(".action-btn").forEach(b => {
    b.classList.toggle("selected", b.dataset.action === actionKey);
  });
  document.getElementById("btnCamera").disabled = false;
  document.getElementById("btnGallery").disabled = false;
  document.getElementById("disabledHint").style.display = "none";
}

/* =========================================================
   Réinitialiser le formulaire objet (reste sur la même pièce)
   ========================================================= */
function resetObjectForm(){
  currentAction = null;
  currentFile = null;
  document.getElementById("objectName").value = "";
  document.getElementById("previewWrap").style.display = "none";
  document.getElementById("previewImg").src = "";
  document.getElementById("statusBox").className = "status";
  document.getElementById("statusBox").textContent = "";
  document.getElementById("nextActions").style.display = "none";
  document.getElementById("btnCamera").disabled = true;
  document.getElementById("btnGallery").disabled = true;
  document.getElementById("disabledHint").style.display = "block";
  document.querySelectorAll(".action-btn").forEach(b => b.classList.remove("selected"));
  document.getElementById("fileCamera").value = "";
  document.getElementById("fileGallery").value = "";
}

/* =========================================================
   Gestion des fichiers photo
   Les photos issues de l'appareil photo peuvent être très
   volumineuses (plusieurs Mo, 12+ mégapixels) : les charger et
   les encoder telles quelles fait planter certains téléphones
   ("mémoire insuffisante"). On les redimensionne donc et on les
   compresse via un <canvas> avant aperçu et envoi, que la photo
   vienne de l'appareil photo ou d'un fichier existant.
   ========================================================= */
const MAX_DIMENSION = 1600;   // taille max (en px) du côté le plus long
const JPEG_QUALITY = 0.82;    // qualité de compression JPEG (0 à 1)

function handleFile(file){
  if(!file) return;
  const statusBox = document.getElementById("statusBox");
  statusBox.className = "status loading show";
  statusBox.textContent = "⏳ Préparation de la photo...";
  document.getElementById("nextActions").style.display = "none";

  compressImage(file, MAX_DIMENSION, JPEG_QUALITY)
    .then(({ dataUrl, base64, mimeType }) => {
      currentFile = { base64, mimeType };
      document.getElementById("previewImg").src = dataUrl;
      document.getElementById("previewWrap").style.display = "block";
      uploadPhoto();
    })
    .catch(err => {
      statusBox.className = "status err show";
      statusBox.textContent = "❌ Impossible de traiter cette photo (" + err.message + "). Réessayez, ou choisissez le fichier depuis la galerie.";
    });
}

/**
 * Redimensionne et compresse une image (File) en JPEG via un canvas.
 * Retourne { dataUrl, base64, mimeType }.
 */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    if(!file.type || !file.type.startsWith("image/")){
      reject(new Error("Le fichier choisi n'est pas une image"));
      return;
    }

    const objectUrl = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      try {
        let { width, height } = img;

        if(!width || !height){
          throw new Error("Dimensions de l'image illisibles");
        }

        if(width > maxDim || height > maxDim){
          if(width >= height){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const mimeType = "image/jpeg";
        const dataUrl = canvas.toDataURL(mimeType, quality);
        const base64 = dataUrl.split(",")[1];

        URL.revokeObjectURL(objectUrl);
        resolve({ dataUrl, base64, mimeType });
      } catch(e){
        URL.revokeObjectURL(objectUrl);
        reject(e);
      }
    };

    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("lecture de l'image impossible"));
    };

    img.src = objectUrl;
  });
}

document.getElementById("fileCamera").addEventListener("change", e => handleFile(e.target.files[0]));
document.getElementById("fileGallery").addEventListener("change", e => handleFile(e.target.files[0]));

document.getElementById("btnCamera").addEventListener("click", () => {
  if(!currentAction) return;
  document.getElementById("fileCamera").click();
});
document.getElementById("btnGallery").addEventListener("click", () => {
  if(!currentAction) return;
  document.getElementById("fileGallery").click();
});

/* =========================================================
   Upload vers Google Apps Script -> Google Drive
   ========================================================= */
function uploadPhoto(){
  const statusBox = document.getElementById("statusBox");
  const nextActions = document.getElementById("nextActions");

  if(CONFIG.SCRIPT_URL.includes("COLLE_ICI")){
    statusBox.className = "status err show";
    statusBox.textContent = "⚠️ L'URL du script Google n'est pas configurée. Voir le README.";
    return;
  }

  const objectNameRaw = document.getElementById("objectName").value.trim();
  const objectSlug = slugify(objectNameRaw);
  const roomSlug = currentRoom.key;
  const user = getUserName() || "utilisateur";
  const ext = (currentFile.mimeType.split("/")[1] || "jpg").replace("jpeg","jpg");
  const filename = `${roomSlug}_${objectSlug}_${user}_${timestamp()}.${ext}`;

  statusBox.className = "status loading show";
  statusBox.textContent = "⏳ Envoi de la photo en cours...";
  nextActions.style.display = "none";

  const payload = {
    action: currentAction,
    room: currentRoom.label,
    objectName: objectNameRaw || "(sans nom)",
    username: user,
    filename: filename,
    mimeType: currentFile.mimeType,
    data: currentFile.base64
  };

  fetch(CONFIG.SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // évite le preflight CORS
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(json => {
    if(json && json.ok){
      statusBox.className = "status ok show";
      statusBox.textContent = "✅ Photo enregistrée dans le dossier Drive !";
      if(json.sheetLogged === false){
        statusBox.textContent += " (⚠️ non ajoutée au tableau de suivi Google Sheets — la photo, elle, est bien sauvegardée)";
      }
    } else {
      statusBox.className = "status err show";
      statusBox.textContent = "❌ Erreur : " + (json && json.error ? json.error : "réponse invalide.");
    }
  })
  .catch(err => {
    statusBox.className = "status err show";
    statusBox.textContent = "❌ Échec de l'envoi (connexion ?). " + err.message;
  })
  .finally(() => {
    nextActions.style.display = "flex";
  });
}

/* =========================================================
   Boutons de fin de traitement objet
   ========================================================= */
document.getElementById("btnAnother").addEventListener("click", resetObjectForm);
document.getElementById("btnHome2").addEventListener("click", goHome);
document.getElementById("backBtn").addEventListener("click", goHome);
document.getElementById("homeBtnTop").addEventListener("click", goHome);

/* =========================================================
   Nom d'utilisateur (première utilisation)
   ========================================================= */
function updateUserChip(){
  const name = getUserName();
  document.getElementById("userChip").textContent = name ? `👤 ${name}` : "👤 —";
}

document.getElementById("userChip").addEventListener("click", () => {
  document.getElementById("userNameInput").value = getUserName();
  document.getElementById("userModal").style.display = "flex";
});

document.getElementById("userNameSave").addEventListener("click", () => {
  const val = document.getElementById("userNameInput").value.trim();
  if(!val){ return; }
  setUserName(val);
  updateUserChip();
  document.getElementById("userModal").style.display = "none";
});

/* =========================================================
   Routage par hash (une "page" par pièce)
   ========================================================= */
window.addEventListener("hashchange", () => {
  const key = location.hash.replace("#","");
  if(key) openRoom(key, false); else goHome();
});

/* =========================================================
   Initialisation
   ========================================================= */
function init(){
  renderRoomGrid();
  updateUserChip();
  if(!getUserName()){
    document.getElementById("userModal").style.display = "flex";
  }
  const key = location.hash.replace("#","");
  if(key) openRoom(key, false); else goHome();
}
init();
</script>
